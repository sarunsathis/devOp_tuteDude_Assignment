<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 100%;
            max-width: 400px;
        }
        .info table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        .info th, .info td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        .info td:first-child {
            background-color: #f0f0f0;
            font-weight: bold;
            color: #555;
        }
        .info td {
            color: #333;
        }
        .thanks {
            font-size: 20px;
            color: #4CAF50;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="info">
            <table>
                <tr>
                    <td>Name:</td>
                    <td>{{name}}</td>
                </tr>
                <tr>
                    <td>Email:</td>
                    <td>{{email}}</td>
                </tr>
                <tr>
                    <td>Time:</td>
                    <td>{{time}}</td>
                </tr>
                <tr>
                    <td>Day:</td>
                    <td>{{date}}</td>
                </tr>
            </table>
        </div>
        <p class="thanks">Thank you for signing up!</p>
    </div>
</body>
</html>
