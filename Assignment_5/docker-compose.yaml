version: '3.8'
services:
  backend:
    build: ./backend
    hostname: backend
    volumes:
      - ./backend:/app
    ports:
      - "5000:5000"
    networks:
      - forms-network

  frontend:
    build: ./frontend
    hostname: frontend
    volumes:
      - ./frontend:/app
    ports:
      - "5001:5001"
    links:
      - backend
    depends_on:
      - backend
    networks:
      - forms-network

networks:
  forms-network: {}